<div class="col-12 col-sm-6 col-lg-4 col-xxl-3">
    <div class="h-100 card bg-military-black cust-alumni">
        <div class="p-2 card-body d-flex align-items-center">
            {{ partial "member-photo.html" (dict "page" . "size" 50 "class" "me-2") }}
            <div class="flex-grow-1 d-flex flex-column">
                <h3 class="m-0 ms-1 fs-6 fw-semibold">{{ .Title }}</h3>
                <div class="ms-1 d-flex flex-wrap">
                    {{ range .Params.areas }}
                        {{ partial "areas.html" (dict "context" .) }}
                    {{ end }}
                </div>
            </div>
            <a class="btn btn-sm btn-outline-primary" href="{{ .Permalink }}">{{ T "members-list-card-btn1" }}</a>
        </div>
    </div>
</div>
